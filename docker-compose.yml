version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduflow-app
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_NAME: EduFlow
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eduflow
      DB_USERNAME: eduflow_user
      DB_PASSWORD: secret_password
      RUN_MIGRATIONS: "true"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: eduflow-db
    restart: always
    environment:
      MYSQL_DATABASE: eduflow
      MYSQL_USER: eduflow_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: eduflow-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db

volumes:
  db_data:
